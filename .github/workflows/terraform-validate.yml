name: Terraform Module Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Terraform Modules
    runs-on: ubuntu-latest

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Preparar cache de providers
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache de providers Terraform
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ hashFiles('modules/**/versions.tf') }}

      - name: Terraform Format Check (Root)
        run: terraform fmt -check -recursive

      - name: Validate All Modules
        run: |
          set -euo pipefail

          for module in modules/*/; do
            echo "== Validating ${module} =="
            (cd "$module" && terraform init -backend=false && terraform validate)
          done

      - name: Validate All Examples
        run: |
          set -euo pipefail

          for example in examples/*/; do
            echo "== Validating ${example} =="
            (cd "$example" && terraform init -backend=false && terraform validate)
          done
